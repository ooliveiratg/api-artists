                  id:
                    type: integer
                    description: "ID do artista"
                  name:
                    type: string
                    description: "Nome do artista"
                  genre:
                    type: string
                    description: "Gênero musical do artista"
                  bio:
                    type: string
                    description: "Biografia do artista"
                  imageURL:
                    type: string
                    description: "URL da imagem do artista"
              example:
                id: 1
                name: "Artista Exemplo"
                genre: "Pop"
                bio: "Biografia do artista exemplo."
                imageURL: "https://example.com/image.jpg"

        "400":
          description: "Erro ao criar artista"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: "Mensagem de erro"
                example:
                  message: "Todos os campos são obrigatórios"

        "500":
