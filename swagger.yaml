                    type: string
                    description: "Mensagem de erro"
                example:
                  message: "Administrador não encontrado" 

  /artist/create:
    post:
      tags:
        - artistas
      summary: "Cadastro de artista"
      description: "Cria um novo artista no sistema"
      security:
