# aqui eu crio componentes que serão reutilizados
components:
  schemas:
    UserRegister:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          description: "Email do usuário"

        password:
          type: string
          description: "Senha do usuário"
        name:
          type: string
          description: "Nome do usuário"

    UserLogin:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: "Email do usuário"

        password:
          type: string
          description: "Senha do usuário"
      example :
            email: "admin@example.com"
            password: "admin123"

    ArtistCreate:
      type: object
      required:
        - name
        - genre
        - bio
      properties:
        name:
          type: string
          description: "Nome do artista"
        genre:
          type: string
          description: "Gênero musical do artista"
        bio:
          type: string
          description: "Biografia do artista"
        imageURL:
          type: string
          description: "URL da imagem do artista"
        imageBase64:
          type: string
          description: "Imagem do artista em base64 (opcional)"
      example:
        name: "Artista Exemplo"
        genre: "Pop"
        bio: "Biografia do artista exemplo."
        imageURL: "https://example.com/image.jpg"
        imageBase64: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUA..."

    SongsCreate:
      type: object
      required:
        - title
        - duration
        - artistName
      properties:
        title:
          type: string
          description: "titulo da música"
        duration:
          type: string
          description: "tempo de duração das musicas"
        artistName:
          type: string
          description: "nome do artista"
        imageURL:
          type: string
          description: "URL da imagem do artista"
        imageBase64:
          type: string
          description: "Imagem do artista em base64 (opcional)"
      example:
        title: "Música Exemplo"
        duration: "3:45"
        artistName: "Artista Exemplo"
        imageURL: "https://example.com/image.jpg"
        imageBase64: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUA..."

    AlbumCreate:
      type: object
      required:
        - title
        - artistName
        - releaseDate
      properties:
        title:
          type: string
          description: "Título do álbum"
        artistName:
          type: string
          description: "Nome do artista"
        releaseDate:
          type: string
          format: date-time
          description: "Data de lançamento do álbum"
        imageURL:
          type: string
          description: "URL da imagem do álbum"
        imageBase64:
          type: string
          description: "Imagem do álbum em base64 (opcional)"
      example:
        title: "Álbum Exemplo"
        artistName: "Artista Exemplo"
        releaseDate: "2023-10-01T00:00:00Z"
        imageURL: "https://example.com/album.jpg"
        imageBase64: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUA..."
  # aqui eu defino os esquemas de segurança
  securitySchemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT

    